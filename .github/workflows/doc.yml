name: Documentation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --locked --dev --extra viewer
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1
          mkdir -p "$HOME/firefox-bin"
          curl -fL "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US" -o /tmp/firefox.tar.xz
          tar -xf /tmp/firefox.tar.xz -C "$HOME/firefox-bin"
          "$HOME/firefox-bin/firefox/firefox" --version

      - name: Compile documentation
        run: |
          cd docs
          PATH="$HOME/firefox-bin/firefox:$PATH" MOZ_HEADLESS=1 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s '-screen 0 1920x1440x24' uv run bash generate_doc.sh

